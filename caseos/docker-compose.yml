services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./caseos.db
      - STORAGE_ROOT=./data
      - CORS_ORIGINS=http://localhost:3000
    ports:
      - "8000:8000"
  web:
    build: ./frontend
    command: npm run dev
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
